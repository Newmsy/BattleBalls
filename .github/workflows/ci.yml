name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Lets the auto-merge job rebuild main: merges made with GITHUB_TOKEN don't
  # fire push events, but they may dispatch a workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.3"

# Where the heavy checks run:
# - Draft PR pushes: unit tests and database tests only. Drafts never merge, and
#   CLAUDE.md asks for the full checks locally before pushing.
# - Ready PRs (and every push to one): everything the diff can affect, including
#   the balance matrix and the browser smoke test. This is the merge gate.
# - main: unit and database tests, then build, deploy and migrate. Its commits
#   already passed the full gate as a PR, and the next PR's run (on its merge
#   with main) catches anything two merges break together.
# The repo is public, so minutes are free but an account runs at most 20 jobs at
# once: the smoke shards (4) plus balance shards (up to 14) plus Sim and Database
# tests fit in one wave. Each job has a timeout so a hang can't run for hours.

jobs:
  test:
    name: Sim tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The cached editor binary starts in seconds; pulling a Godot container
      # image took about a minute and a half per run.
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Import project
        run: timeout 180 ~/godot/godot --headless --import || true
      - name: Unit, determinism and golden replay tests
        run: GODOT=~/godot/godot tests/run.sh
      - name: Which checks this PR needs
        id: changes
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: tools/ci/changes.sh "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"
      # One boon per process on every core; skipped when nothing under sim/ changed.
      - name: Bounce Run boons stay a tilt, not a verdict
        if: steps.changes.outputs.sim == 'true'
        run: |
          set -o pipefail
          GODOT=~/godot/godot timeout 900 tools/ci/boons.sh --fights=40 --strict | tee -a "$GITHUB_STEP_SUMMARY"

  # The balance gate (BALANCE.md), split so it scales to the full roster.
  # balance-plan picks the pairings (every pairing for a small roster, else
  # only the critters this PR changed, plus a fixed sample on an engine change)
  # and how many machines to spread them over; each Balance shard fights its
  # share and fails on a FAIL. The weekly Balance audit workflow fights every
  # pairing on main. balance-plan also says whether the diff can affect the
  # web build, so a docs-only PR skips the smoke test.
  balance-plan:
    name: Balance plan
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.plan.outputs.only }}
      shards: ${{ steps.plan.outputs.shards }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: tools/ci/balance_plan.sh "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"
      - id: changes
        run: tools/ci/changes.sh "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"

  balance:
    name: Balance (shard ${{ matrix.shard }})
    needs: balance-plan
    if: needs.balance-plan.result == 'success' && needs.balance-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.balance-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Import project
        run: timeout 180 ~/godot/godot --headless --import || true
      # Square matchups (the cells that FAIL a PR) get 100 seeds. Arena and
      # Chaos twist cells only WARN on a PR (#67), so 25 seeds report them;
      # the weekly audit fights them at full strength.
      - name: Equal power on every arena and under every Chaos Weekend modifier (report in the job summary)
        env:
          ONLY: ${{ needs.balance-plan.outputs.only }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          timeout 2100 ~/godot/godot --headless --script res://tools/balance.gd -- \
            --fights=100 --variant-fights=25 --arena=all --modifiers --strict \
            --shard=${{ matrix.shard }}/$SHARDS ${ONLY:+--only=$ONLY} \
            | grep -v '^Godot Engine' | tee -a "$GITHUB_STEP_SUMMARY"

  # Applies supabase/migrations to a plain Postgres with a stub of Supabase's
  # auth schema and checks row-level security and the game's RPCs.
  db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, row-level security and RPC tests
        run: tests/db/run.sh

  # The browser smoke test, spread over machines (SMOKE_SHARD in smoke.mjs).
  # Each shard exports its own build (about 20 seconds) and hands its
  # screenshots to the Web job for the preview.
  smoke:
    name: Smoke test (shard ${{ matrix.shard }})
    needs: balance-plan
    if: needs.balance-plan.result == 'success' && needs.balance-plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Export
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: tools/ci/export_web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: smoke
        run: npm ci && npx playwright install --with-deps chromium
      - name: Play this shard's smoke cases in a phone-sized browser
        working-directory: smoke
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node smoke.mjs ../build/web
      # Screenshots ride along with the preview. Best effort: a storage hiccup
      # loses screenshots, never the merge gate.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ matrix.shard }}
          path: smoke/screenshots/*.png
          retention-days: 1
          if-no-files-found: ignore

  # Builds and deploys the preview (PRs) or the live site (main). On a PR it
  # waits for the smoke test, so a broken build never gets a preview link.
  web:
    name: Web build and preview
    needs: [balance-plan, smoke]
    # Not on drafts: nothing previews or merges from a draft.
    if: >-
      always() && !cancelled() && (github.event_name != 'pull_request'
      || (!github.event.pull_request.draft && needs.balance-plan.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.smoke.result)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Export
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: tools/ci/export_web.sh
      - name: Publish smoke screenshots with the preview
        if: github.event_name == 'pull_request' && needs.smoke.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          merge-multiple: true
          path: build/web/smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Vercel
        id: vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: build/web
        run: |
          npx --yes vercel@60.1.3 link --yes --project battleballs --token "$VERCEL_TOKEN"
          prod=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then prod="--prod"; fi
          url=$(npx --yes vercel@60.1.3 deploy --yes $prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          SMOKE: ${{ needs.smoke.result }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- preview-link -->';
            const shots = process.env.SMOKE === 'success' ? ` · [smoke screenshots](${url}/smoke/3-menu.png)` : ' · smoke test skipped (nothing it checks changed)';
            const body = url
              ? `${marker}\n**Preview:** ${url} (build ${sha})${shots}`
              : `${marker}\n**Preview not deployed** (build ${sha}): the \`VERCEL\` repo secret is missing.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # A green, non-draft PR merges itself. Drafts never auto-merge, so a PR
  # stays draft until its code review is done.
  automerge:
    name: Auto-merge
    needs: [test, db, web, balance-plan, balance, smoke]
    # Balance and the smoke test are skipped when a PR touches nothing they
    # check; skipped is fine, anything else that isn't success blocks the merge.
    if: >-
      always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.test.result == 'success' && needs.db.result == 'success' && needs.web.result == 'success'
      && needs.balance-plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.balance.result)
      && contains(fromJSON('["success","skipped"]'), needs.smoke.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --squash \
            --match-head-commit "${{ github.event.pull_request.head.sha }}"
      - name: Rebuild main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref main

  # Pushes new supabase/migrations to the live project once they are on main.
  # Skips (green) until the Supabase secrets exist.
  migrate:
    name: Apply database migrations
    needs: [test, db]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Supabase secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase secrets not set yet: migrations not applied."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^ *https://([a-z0-9]+)\.supabase\.co.*#\1#')
          supabase link --project-ref "$ref"
          supabase db push
      - name: Apply auth settings (email codes, Apple / Google when set up)
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: node tools/supabase_auth_config.mjs
