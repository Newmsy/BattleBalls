name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    name: Sim tests
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: timeout 180 godot --headless --import || true
      - name: Unit, determinism and golden replay tests
        run: tests/run.sh
      - name: Balance sim (win-rate matrix in the job summary)
        run: |
          set -o pipefail
          timeout 900 godot --headless --script res://tools/balance.gd -- --fights=100 | grep -v '^Godot Engine' | tee -a "$GITHUB_STEP_SUMMARY"

  web:
    name: Web build
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates where Godot looks for them
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
      - name: Stamp build
        run: echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7 > build_info.txt
      - name: Export
        run: |
          timeout 180 godot --headless --import || true
          mkdir -p build/web
          timeout 300 godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  smoke:
    name: Browser smoke test
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: smoke
        run: npm ci && npx playwright install --with-deps chromium
      - name: Play two fights in a phone-sized browser
        working-directory: smoke
        run: node smoke.mjs ../build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/screenshots

  preview:
    name: Deploy preview
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '.' }}
          keep_files: true
          commit_message: "Deploy ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}"
      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const url = `https://${owner}.github.io/${context.repo.repo}/pr-${context.issue.number}/`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- preview-link -->';
            const body = `${marker}\n**Preview:** ${url} (build ${sha})`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
