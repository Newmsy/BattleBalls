name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Lets the auto-merge job rebuild main: merges made with GITHUB_TOKEN don't
  # fire push events, but they may dispatch a workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.3"

# Actions minutes are a budget (the repo is private). Where the heavy checks run:
# - Draft PR pushes: unit tests and database tests only. Drafts never merge, and
#   CLAUDE.md asks for the full checks locally before pushing.
# - Ready PRs (and every push to one): everything, including the balance matrix
#   and the browser smoke test. This is the merge gate.
# - main: unit and database tests, then build, deploy and migrate. Its commits
#   already passed the full gate as a PR, and the next PR's run (on its merge
#   with main) catches anything two merges break together.
# Each job has a timeout so a hang can't burn hours of minutes.

jobs:
  test:
    name: Sim tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The cached editor binary starts in seconds; pulling a Godot container
      # image took about a minute and a half per run.
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Import project
        run: timeout 180 ~/godot/godot --headless --import || true
      - name: Unit, determinism and golden replay tests
        run: GODOT=~/godot/godot tests/run.sh
      - name: Bounce Run boons stay a tilt, not a verdict
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: |
          set -o pipefail
          timeout 900 ~/godot/godot --headless --script res://tools/boon_balance.gd -- --fights=40 --strict | grep -v '^Godot Engine' | tee -a "$GITHUB_STEP_SUMMARY"

  # The balance gate (BALANCE.md), split so it scales to the full roster.
  # balance-plan picks the pairings (every pairing for a small roster, else
  # only the critters this PR changed, plus a fixed sample on an engine change)
  # and how many machines to spread them over; each Balance shard fights its
  # share and fails on a FAIL. The weekly Balance audit workflow fights every
  # pairing on main.
  balance-plan:
    name: Balance plan
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.plan.outputs.only }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: tools/ci/balance_plan.sh "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"

  balance:
    name: Balance (shard ${{ matrix.shard }})
    needs: balance-plan
    if: needs.balance-plan.result == 'success' && needs.balance-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.balance-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Import project
        run: timeout 180 ~/godot/godot --headless --import || true
      - name: Equal power on every arena and under every Chaos Weekend modifier (report in the job summary)
        env:
          ONLY: ${{ needs.balance-plan.outputs.only }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          timeout 2100 ~/godot/godot --headless --script res://tools/balance.gd -- \
            --fights=100 --variant-fights=50 --arena=all --modifiers --strict \
            --shard=${{ matrix.shard }}/$SHARDS ${ONLY:+--only=$ONLY} \
            | grep -v '^Godot Engine' | tee -a "$GITHUB_STEP_SUMMARY"

  # Applies supabase/migrations to a plain Postgres with a stub of Supabase's
  # auth schema and checks row-level security and the game's RPCs.
  db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, row-level security and RPC tests
        run: tests/db/run.sh

  # One job builds, smoke-tests and deploys, so no Actions artifacts are needed.
  web:
    name: Web build, smoke test and preview
    # Not on drafts: nothing previews or merges from a draft.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/download_godot.sh
      - name: Install export templates where Godot looks for them
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Stamp build
        run: echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7 > build_info.txt
      # Only the public anon/publishable key may ship in the game: anyone can
      # read it out of the web build. Row-level security protects the data.
      - name: Online backend config (public key only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY secrets not set: this build plays offline."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, re, sys
          # The dashboard's "API URL" can carry /rest/v1; the game wants the project root.
          url = re.sub(r"/(rest|auth)/v1/?$", "", os.environ["SUPABASE_URL"].strip().rstrip("/"))
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          if not url.startswith("https://"):
              fail("SUPABASE_URL should look like https://<project>.supabase.co")
          if key.startswith("sb_secret_"):
              fail("SUPABASE_ANON_KEY is a secret key. Use the publishable (or legacy anon) key; never ship a secret key.")
          if not key.startswith("sb_publishable_"):
              parts = key.split(".")
              try:
                  claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              except Exception:
                  fail("SUPABASE_ANON_KEY is not a Supabase publishable or anon key")
              if claims.get("role") != "anon":
                  fail(f"SUPABASE_ANON_KEY has role {claims.get('role')!r}, expected 'anon'. Never ship the service_role key.")
          with open("backend_config.json", "w") as f:
              json.dump({"url": url, "anon_key": key}, f)
          print("Backend config written for", url)
          PY
      - name: Export
        run: |
          timeout 180 ~/godot/godot --headless --import || true
          mkdir -p build/web
          timeout 300 ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          # The live-ops schedule, served next to the game so builds can refresh it.
          cp liveops/liveops.json build/web/liveops.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The smoke test is most of CI's minutes, so it runs on PRs (the merge
      # gate) and not again on main.
      - name: Install Playwright
        if: github.event_name == 'pull_request'
        working-directory: smoke
        run: npm ci && npx playwright install --with-deps chromium
      - name: Play two fights in a phone-sized browser
        if: github.event_name == 'pull_request'
        working-directory: smoke
        run: node smoke.mjs ../build/web
      - name: Publish screenshots with the preview
        if: always() && github.event_name == 'pull_request'
        run: mkdir -p build/web/smoke && cp smoke/screenshots/*.png build/web/smoke/ || true
      - name: Deploy to Vercel
        id: vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: build/web
        run: |
          npx --yes vercel@60.1.3 link --yes --project battleballs --token "$VERCEL_TOKEN"
          prod=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then prod="--prod"; fi
          url=$(npx --yes vercel@60.1.3 deploy --yes $prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- preview-link -->';
            const body = url
              ? `${marker}\n**Preview:** ${url} (build ${sha}) · [smoke screenshots](${url}/smoke/3-menu.png)`
              : `${marker}\n**Preview not deployed** (build ${sha}): the \`VERCEL\` repo secret is missing.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # A green, non-draft PR merges itself. Drafts never auto-merge, so a PR
  # stays draft until its code review is done.
  automerge:
    name: Auto-merge
    needs: [test, db, web, balance-plan, balance]
    # Balance is skipped when a PR touches nothing it checks; skipped is fine,
    # anything else that isn't success blocks the merge.
    if: >-
      always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.test.result == 'success' && needs.db.result == 'success' && needs.web.result == 'success'
      && needs.balance-plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.balance.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --squash \
            --match-head-commit "${{ github.event.pull_request.head.sha }}"
      - name: Rebuild main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref main

  # Pushes new supabase/migrations to the live project once they are on main.
  # Skips (green) until the Supabase secrets exist.
  migrate:
    name: Apply database migrations
    needs: [test, db]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Supabase secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase secrets not set yet: migrations not applied."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^ *https://([a-z0-9]+)\.supabase\.co.*#\1#')
          supabase link --project-ref "$ref"
          supabase db push
      - name: Apply auth settings (email codes, Apple / Google when set up)
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: node tools/supabase_auth_config.mjs
