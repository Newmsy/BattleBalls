name: Android

# Builds the Google Play app bundle (.aab) from main, and on demand from any
# branch (Actions > Android > Run workflow). Not part of the PR merge gate.
# Download the signed bundle from the run's Artifacts and upload it in the Play
# Console; once PLAY_SERVICE_ACCOUNT_JSON is set, main uploads it to the
# internal testing track by itself.
#
# Repo secrets (Settings > Secrets and variables > Actions). Never commit them:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore (and key) password
#   ANDROID_KEY_ALIAS          key alias (default "upload")
#   PLAY_SERVICE_ACCOUNT_JSON  optional: Play Console service account for uploads
#   SUPABASE_URL / SUPABASE_ANON_KEY  as for the web build (public key only)

on:
  push:
    branches: [main]
  # PRs that change the Android build itself build it too (without uploading).
  pull_request:
    paths:
      - export_presets.cfg
      - project.godot
      - addons/**
      - game/platform/**
      - game/glow/play_store.gd
      - tools/ci/export_android.sh
      - tools/ci/patch_android_build.sh
      - tools/ci/download_godot.sh
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.3"
  PACKAGE_NAME: com.newms.battleballs

jobs:
  aab:
    name: Google Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK parts the build needs
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Cache Godot and Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GODOT_TEMPLATES: android
        run: tools/ci/download_godot.sh
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-${{ env.GODOT_VERSION }}-${{ hashFiles('addons/GodotGooglePlayBilling/export_plugin.gd', 'tools/ci/patch_android_build.sh') }}
      - name: Export the .aab
        env:
          BUILD_SHA: ${{ github.sha }}
          # Play needs a bigger version code on every upload.
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: tools/ci/export_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: battleballs-aab-${{ github.run_number }}
          path: build/android/battleballs.aab
          if-no-files-found: error
      - name: Check the Play upload secrets
        id: play
        env:
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY" ] && [ -n "$KEY" ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not uploading to Play (needs PLAY_SERVICE_ACCOUNT_JSON and the keystore secrets, on main)."
          fi
      - name: Upload to the Play internal testing track
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/android/battleballs.aab
          track: internal
          status: draft
