<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#ff6fb0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Battle Balls loading screen: the sunset arena from game/ui/splash_art.gd,
   rendered to game/brand/loading.png (tools/brand/render_loading.gd), which
   Godot's export serves as $GODOT_SPLASH. The game draws the same picture
   live and calls window.bbGameReady() once it has, so the hand-over is seamless. */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	background-color: #ff8f7a;
}

body {
	color: #ffffff;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	visibility: hidden;
	overflow: hidden;
	background: linear-gradient(#ff6fb0 0%, #ff8f7a 35%, #ffe9a0 56%, #7a46d8 57%, #4a2a9e 80%, #2c1a6e 100%);
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
	transition: opacity 0.35s ease-out;
	z-index: 1;
}

#status.done {
	opacity: 0;
}

#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: 50% 47%;
}

#status-foot {
	position: absolute;
	left: 0;
	right: 0;
	bottom: max(6vh, calc(env(safe-area-inset-bottom) + 24px));
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 14px;
}

#status-progress {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	width: min(70vw, 340px);
}

#status-bar {
	position: relative;
	width: 100%;
	height: 20px;
	border-radius: 999px;
	background: #ffffff;
	border: 4px solid #2a1748;
	box-shadow: 0 4px 0 rgba(42, 23, 72, 0.35);
	overflow: hidden;
}

#status-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 6%;
	border-radius: 999px;
	background: linear-gradient(#ffe066 0 45%, #ffab1f 55% 100%);
	transition: width 0.2s ease-out;
}

#status-bar.indeterminate #status-fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { left: 0; }
	to { left: 70%; }
}

#status-label, #status-tip {
	color: #ffffff;
	font-weight: 800;
	text-align: center;
	text-shadow: 0 2px 0 #2a1748, 2px 0 0 #2a1748, -2px 0 0 #2a1748, 0 -2px 0 #2a1748,
		2px 2px 0 #2a1748, -2px 2px 0 #2a1748, 2px -2px 0 #2a1748, -2px -2px 0 #2a1748, 0 4px 0 rgba(42, 23, 72, 0.4);
}

#status-label {
	font-size: 17px;
	letter-spacing: 0.12em;
	text-transform: uppercase;
}

#status-tip {
	margin: 0 28px;
	font-size: 15px;
	line-height: 1.4;
	transition: opacity 0.3s;
}

#status-notice {
	display: none;
	position: absolute;
	top: 50%;
	left: 0;
	right: 0;
	transform: translateY(-50%);
	background-color: #ffffff;
	border-radius: 18px;
	border: 4px solid #2a1748;
	color: #2a1748;
	font-weight: 700;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}

/* Short phones (iPhone SE): keep the bar low and drop the tip so the
   critters on the arena ring stay in view. */
@media (max-aspect-ratio: 10/17) and (max-height: 700px), (min-aspect-ratio: 10/17) {
	#status-foot {
		bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px));
	}
	#status-tip {
		display: none !important;
	}
}

@media (prefers-reduced-motion: reduce) {
	#status-bar.indeterminate #status-fill {
		animation: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Battle Balls needs JavaScript turned on.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="Battle Balls">
			<div id="status-foot">
				<div id="status-progress">
					<div id="status-bar" class="indeterminate"><div id="status-fill"></div></div>
					<div id="status-label">Loading arena</div>
				</div>
				<div id="status-tip"></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script>
// Silence the game while it's in the background (app minimised, tab hidden or
// phone locked) and pick the sound back up on return: every audio context the
// engine makes is remembered and suspended while the page is hidden.
(function () {
	try {
		const contexts = [];
		for (const name of ['AudioContext', 'webkitAudioContext']) {
			const Base = window[name];
			if (!Base) continue;
			window[name] = class extends Base {
				constructor(...args) { super(...args); contexts.push(this); }
			};
		}
		const sync = function (e) {
			const away = document.hidden || (e && e.type === 'pagehide');
			for (const ctx of contexts) {
				try {
					if (away) {
						if (ctx.state === 'running') ctx.suspend();
					} else if (ctx.state === 'suspended') {
						ctx.resume();
					}
				} catch (e) {}
			}
		};
		document.addEventListener('visibilitychange', sync);
		window.addEventListener('pagehide', sync);
		window.addEventListener('pageshow', sync);
	} catch (e) {}
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const statusTip = document.getElementById('status-tip');

	const TIPS = [
		'Bank your shot off the walls to catch a foe off guard.',
		'Fuse three of the same critter to climb a tier.',
		'Every fight replays exactly from its launch angles.',
		'A new Daily Trick Shot puzzle lands every day.',
	];
	let tip = Math.floor(Math.random() * TIPS.length);
	statusTip.textContent = TIPS[tip];
	const tipTimer = setInterval(() => {
		tip = (tip + 1) % TIPS.length;
		statusTip.style.opacity = 0;
		setTimeout(() => {
			statusTip.textContent = TIPS[tip];
			statusTip.style.opacity = 1;
		}, 300);
	}, 3200);

	window.bbGameReady = function () {
		setStatusMode('hidden');
	};

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			initializing = false;
			// Fade out over the first frames instead of cutting to the game.
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 400);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusTip.style.display = mode === 'notice' ? 'none' : 'block';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Battle Balls can\'t run in this browser. Missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					statusBar.classList.remove('indeterminate');
					statusFill.style.width = Math.max(6, pct) + '%';
					statusLabel.textContent = pct >= 100 ? 'Entering arena' : 'Loading arena ' + pct + '%';
				} else {
					statusBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			// The game says when it has drawn its own copy of this screen
			// (game/ui/splash_art.gd); the timer is a safety net.
			statusLabel.textContent = 'Entering arena';
			setTimeout(() => setStatusMode('hidden'), 4000);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
