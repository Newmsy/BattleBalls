<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0b0a1f">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Battle Balls loading screen (Neon Critters). Godot's export fills in the
   $GODOT_* placeholders; the splash image is game/brand/splash.png. */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	background-color: #0b0a1f;
}

body {
	color: #f0eeff;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 3vh;
	visibility: hidden;
	background:
		repeating-linear-gradient(0deg, rgba(143, 123, 255, 0.06) 0 1px, transparent 1px 44px),
		repeating-linear-gradient(90deg, rgba(143, 123, 255, 0.06) 0 1px, transparent 1px 44px),
		radial-gradient(ellipse at 50% 40%, #2c2170 0%, #141038 55%, #0b0a1f 100%);
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
	transition: opacity 0.35s ease-out;
	z-index: 1;
}

#status.done {
	opacity: 0;
}

#status::before {
	/* The arena's glowing border. */
	content: '';
	position: absolute;
	inset: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
	border: 3px solid #c2b5ff;
	border-radius: 34px;
	box-shadow: 0 0 22px 4px rgba(143, 123, 255, 0.55), inset 0 0 22px 2px rgba(143, 123, 255, 0.35);
	pointer-events: none;
}

#status-splash {
	width: min(78vw, 46vh, 420px);
	height: auto;
	animation: bob 1.1s ease-in-out infinite alternate;
}

@keyframes bob {
	from { transform: translateY(0) scale(1, 1); }
	to { transform: translateY(-2.2vh) scale(0.99, 1.01); }
}

#status-progress {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	width: min(64vw, 320px);
}

#status-bar {
	position: relative;
	width: 100%;
	height: 14px;
	border-radius: 999px;
	background: #1b1842;
	border: 2px solid #2b2760;
	overflow: hidden;
}

#status-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 6%;
	border-radius: 999px;
	background: linear-gradient(90deg, #8f7bff, #ff6fae);
	box-shadow: 0 0 12px #8f7bff;
	transition: width 0.2s ease-out;
}

#status-bar.indeterminate #status-fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { left: 0; }
	to { left: 70%; }
}

#status-label {
	font-size: 15px;
	font-weight: 700;
	letter-spacing: 0.14em;
	text-transform: uppercase;
	color: #a29fc9;
}

#status-tip {
	position: absolute;
	bottom: max(9vh, calc(env(safe-area-inset-bottom) + 40px));
	left: 32px;
	right: 32px;
	text-align: center;
	font-size: 15px;
	line-height: 1.4;
	color: #a29fc9;
	transition: opacity 0.3s;
}

#status-notice {
	display: none;
	background-color: #1b1842;
	border-radius: 16px;
	border: 2px solid #ff5a7a;
	color: #f0eeff;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}

@media (prefers-reduced-motion: reduce) {
	#status-splash, #status-bar.indeterminate #status-fill {
		animation: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Battle Balls needs JavaScript turned on.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="Battle Balls">
			<div id="status-progress">
				<div id="status-bar" class="indeterminate"><div id="status-fill"></div></div>
				<div id="status-label">Loading arena</div>
			</div>
			<div id="status-notice"></div>
			<div id="status-tip"></div>
		</div>

		<script>
// Silence the game while it's in the background (app minimised, tab hidden or
// phone locked) and pick the sound back up on return: every audio context the
// engine makes is remembered and suspended while the page is hidden.
(function () {
	try {
		const contexts = [];
		for (const name of ['AudioContext', 'webkitAudioContext']) {
			const Base = window[name];
			if (!Base) continue;
			window[name] = class extends Base {
				constructor(...args) { super(...args); contexts.push(this); }
			};
		}
		const sync = function (e) {
			const away = document.hidden || (e && e.type === 'pagehide');
			for (const ctx of contexts) {
				try {
					if (away) {
						if (ctx.state === 'running') ctx.suspend();
					} else if (ctx.state === 'suspended') {
						ctx.resume();
					}
				} catch (e) {}
			}
		};
		document.addEventListener('visibilitychange', sync);
		window.addEventListener('pagehide', sync);
		window.addEventListener('pageshow', sync);
	} catch (e) {}
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const statusTip = document.getElementById('status-tip');

	const TIPS = [
		'Bank your shot off the walls to catch a foe off guard.',
		'Fuse three of the same critter to climb a tier.',
		'Every fight replays exactly from its launch angles.',
		'A new Daily Trick Shot puzzle lands every day.',
	];
	let tip = Math.floor(Math.random() * TIPS.length);
	statusTip.textContent = TIPS[tip];
	const tipTimer = setInterval(() => {
		tip = (tip + 1) % TIPS.length;
		statusTip.style.opacity = 0;
		setTimeout(() => {
			statusTip.textContent = TIPS[tip];
			statusTip.style.opacity = 1;
		}, 300);
	}, 3200);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			initializing = false;
			// Fade out over the first frames instead of cutting to the game.
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 400);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusTip.style.display = mode === 'notice' ? 'none' : 'block';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Battle Balls can\'t run in this browser. Missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					statusBar.classList.remove('indeterminate');
					statusFill.style.width = Math.max(6, pct) + '%';
					statusLabel.textContent = pct >= 100 ? 'Entering arena' : 'Loading arena ' + pct + '%';
				} else {
					statusBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
